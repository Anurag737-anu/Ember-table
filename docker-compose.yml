services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ember
      POSTGRES_PASSWORD: ember_local_only
      POSTGRES_DB: ember
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - ember_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ember']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ember_data:
